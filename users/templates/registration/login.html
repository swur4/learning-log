
{% extends "learning_logs/base.html" %}
{% load bootstrap4 %}

{% block page_header %}
    <h2>Вход в Learning Log</h2>
{% endblock page_header %}

{% block content %}
    <div class="row">
        <div class="col-md-6">
            <form method="post">
                {% csrf_token %}
                {% bootstrap_form form %}

                <button type="submit" class="btn btn-primary">
                    Войти
                </button>
            </form>
        </div>
    </div>
{% endblock content %}
