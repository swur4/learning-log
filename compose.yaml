services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/db.sqlite3
    volumes:
      - learning_log_data:/data
    command: sh -c "python manage.py migrate --noinput && gunicorn learning_log.wsgi:application --bind 0.0.0.0:8000"

volumes:
  learning_log_data: